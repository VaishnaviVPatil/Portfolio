<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <!-- holographic gradient -->
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8D7E3" stop-opacity="0.22"></stop>
      <stop offset="0.35" stop-color="#CDB4DB" stop-opacity="0.22"></stop>
      <stop offset="0.7" stop-color="#EADCF8" stop-opacity="0.22"></stop>
      <stop offset="1" stop-color="#F8D7E3" stop-opacity="0.18"></stop>
    </linearGradient>

    <!-- soft glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- lily symbol (simple line-art) -->
    <g id="lily" fill="none" stroke="url(#holo)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <!-- petals -->
      <path d="M40 72 C32 52, 28 34, 40 20 C52 34, 48 52, 40 72 Z"></path>
      <path d="M40 72 C24 56, 14 40, 22 26 C38 30, 38 52, 40 72 Z"></path>
      <path d="M40 72 C56 56, 66 40, 58 26 C42 30, 42 52, 40 72 Z"></path>

      <!-- stem -->
      <path d="M40 74 C40 112, 38 132, 28 162"></path>
      <path d="M40 96 C55 116, 66 126, 78 134"></path>
      <path d="M34 112 C22 122, 14 132, 10 146"></path>
    </g>
  </defs>

  <!-- scatter lilies -->
  <g opacity="0.85">
    <use href="#lily" x="90" y="120" transform="scale(1.1) rotate(-8 130 180)"></use>
    <use href="#lily" x="380" y="80" transform="scale(0.9) rotate(12 420 140)"></use>
    <use href="#lily" x="700" y="140" transform="scale(1.25) rotate(-6 740 220)"></use>
    <use href="#lily" x="1060" y="90" transform="scale(0.95) rotate(10 1100 150)"></use>
    <use href="#lily" x="1320" y="170" transform="scale(1.15) rotate(-12 1360 240)"></use>

    <use href="#lily" x="180" y="420" transform="scale(1.35) rotate(7 220 500)"></use>
    <use href="#lily" x="540" y="520" transform="scale(1.05) rotate(-10 580 600)"></use>
    <use href="#lily" x="920" y="470" transform="scale(1.25) rotate(9 960 560)"></use>
    <use href="#lily" x="1250" y="520" transform="scale(0.95) rotate(-8 1290 600)"></use>

    <use href="#lily" x="120" y="690" transform="scale(1.0) rotate(-6 160 760)"></use>
    <use href="#lily" x="520" y="700" transform="scale(1.2) rotate(10 560 780)"></use>
    <use href="#lily" x="950" y="720" transform="scale(1.05) rotate(-8 990 800)"></use>
    <use href="#lily" x="1320" y="690" transform="scale(1.3) rotate(7 1360 770)"></use>
  </g>
</svg>