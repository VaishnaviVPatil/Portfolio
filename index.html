<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaishnavi Patil — moved</title>
  <meta name="description" content="This portfolio has moved to portfolio-navi.vercel.app">
  <link rel="canonical" href="https://portfolio-navi.vercel.app/">
  <!-- Meta refresh handles no-JS browsers -->
  <meta http-equiv="refresh" content="0; url=https://portfolio-navi.vercel.app/">
  <script>
    window.location.replace("https://portfolio-navi.vercel.app/");
  </script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #FDF6EC;
      color: #3A2A22;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .card {
      max-width: 28rem;
      padding: 2.5rem 2rem;
      border: 3px solid #6B4A3B;
      border-radius: 1.75rem;
      background: #F9E7D2;
      box-shadow: 6px 6px 0 0 #6B4A3B;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      color: #6B4A3B;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0 0 1.5rem;
      color: #8B6F5F;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      background: #6B4A3B;
      color: #FDF6EC;
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
      border: 3px solid #6B4A3B;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    a:hover {
      background: #F5B7B1;
      color: #6B4A3B;
      transform: translateY(-2px) rotate(-1deg);
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111018; color: #F5F0FA; }
      .card { border-color: #BFA8E8; background: #1E1A29; box-shadow: 6px 6px 0 0 #BFA8E8; }
      h1 { color: #BFA8E8; }
      p { color: #A395C4; }
      a { background: #BFA8E8; color: #111018; border-color: #BFA8E8; }
      a:hover { background: #F0B6CF; color: #111018; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ This portfolio moved</h1>
    <p>Redirecting you to the new site&hellip;</p>
    <a href="https://portfolio-navi.vercel.app/">Take me there →</a>
  </div>
</body>
</html>
