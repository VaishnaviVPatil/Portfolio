<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8D7E3" stop-opacity="0.50"></stop>
      <stop offset="1" stop-color="#CDB4DB" stop-opacity="0.45"></stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4A2C5A" stroke-opacity="0.08" stroke-width="1"></path>
      <circle cx="0" cy="0" r="1.2" fill="#4A2C5A" fill-opacity="0.10"></circle>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"></feGaussianBlur>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#FAF8FB"></rect>
  <rect width="1400" height="900" fill="url(#g)"></rect>
  <rect width="1400" height="900" fill="url(#grid)" filter="url(#soft)"></rect>
</svg>